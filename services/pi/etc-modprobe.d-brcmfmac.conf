# Installed at: /etc/modprobe.d/brcmfmac.conf
#
# brcmfmac driver options for the BCM43430A1 in the Pi Zero W.
#
# roamoff=1
#   Disable firmware-initiated roaming. We have exactly one AP on the
#   Mockingbird LAN, so roaming buys us nothing and is implicated in
#   several wedge traces on linux-wireless.
#
# feature_disable=0x82000
#   Bitmask that disables P2P (bit 13 = 0x2000) and TDLS (bit 19 = 0x80000).
#   Neither is used by anything on this Pi and both interact badly with
#   the 7.45.98 (TOB) firmware. Bit values are from
#   drivers/net/wireless/broadcom/brcm80211/brcmfmac/feature.h — re-verify
#   if/when the kernel is upgraded across a major version.
#
# Takes effect on next module load. Apply with `modprobe -r brcmfmac &&
# modprobe brcmfmac` (will drop the link briefly) or reboot.
#
# Context: docs/ops/rca/2026-05-13-pi-wlan0-wedge.md

options brcmfmac roamoff=1 feature_disable=0x82000
