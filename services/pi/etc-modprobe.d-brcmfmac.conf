# /etc/modprobe.d/brcmfmac.conf
#
# Stabilize the BCM43430 (Pi Zero W) brcmfmac driver against the well-known
# firmware-side wedge. The primary fix is NetworkManager wifi.powersave=2
# (see services/pi/etc-NetworkManager-conf.d-wifi-powersave.conf); this file
# is the secondary mitigation layer.
#
# Params verified against the Trixie kernel (6.12.75+rpt-rpi-v6, 2026-05-13):
#   roamoff=1    - disable firmware-side roaming, known broken on this chip
#
# `feature_disable` was dropped: it exists in upstream brcmfmac but is not
# exposed by the kernel this Pi runs. If a future kernel adds it back, the
# RCA at docs/ops/rca/2026-05-13-pi-wlan0-wedge.md has the bitmask details.
#
# Applies on module reload or reboot.

options brcmfmac roamoff=1
