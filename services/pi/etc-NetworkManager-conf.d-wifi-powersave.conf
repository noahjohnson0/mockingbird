# Installed at: /etc/NetworkManager/conf.d/wifi-powersave.conf
#
# Disable WiFi power save by default for all connections.
#
# Why: the brcmfmac driver in the BCM43430 (Pi Zero W) defaults to PS=on,
# and the radio firmware (7.45.98 (TOB)) has a wedge bug reachable from
# the PS-active state. See docs/ops/rca/2026-05-13-pi-wlan0-wedge.md.
#
# Values for wifi.powersave:
#   0 = use NM internal default
#   1 = ignore (leave as-is)
#   2 = disable power save  <-- we want this
#   3 = enable power save
#
# Restart NetworkManager and bring the Mockingbird connection down/up to apply,
# or reboot.

[connection]
wifi.powersave = 2
