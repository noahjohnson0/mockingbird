## /etc/systemd/journald.conf.d/mockingbird.conf
##
## Hard cap on persistent journal usage. Without this, journald defaults to
## "up to 10% of the filesystem" — on a 64 GB SD card that's 6 GB, which on
## a Pi Zero W is the difference between "noticed the alert at 70%" and
## "filesystem went read-only at 3am because the journal ate everything."
##
## 500M is enough for ~weeks of normal service logs at our volume, and
## journalctl --vacuum-size= is still available for emergencies.
##
## Install: see scripts/install-journald-cap.sh

[Journal]
SystemMaxUse=500M
