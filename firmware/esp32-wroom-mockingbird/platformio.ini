; PlatformIO project for mockingbird ESP32-WROOM-32 leaves.
;
; Targets plain ESP32 (ESP32-D0WD-V3, no PSRAM, 4 MB flash). For ESP32-S3
; with PSRAM, the mockingbird/main ESP-IDF project is the right place.
;
; OTA: device exposes ArduinoOTA on port 3232 with mDNS hostname
;      `mockingbird-<chipid>.local`. From the Mac (on Mockingbird) or any peer
;      that can reach 192.168.8.0/24 (via Tailscale subnet route), push
;      new firmware with:
;
;          pio run -e ota -t upload --upload-port mockingbird-<chipid>.local
;
;      (or pass the bare IP; the hostname is just the mDNS sugar)

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DMOCKINGBIRD_FW_VERSION='"0.3.0-stream"'
    -DMOCKINGBIRD_COLLECTOR_HOST='"192.168.8.202"'
    -DMOCKINGBIRD_COLLECTOR_PORT=9001

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2

; default.csv = ~1.4 MB app0 + 1.4 MB app1 + 1.4 MB SPIFFS — gives us OTA
board_build.partitions = default.csv

; ---- USB flash environment (first install) ----
[env:usb]
upload_port  = /dev/cu.SLAB_USBtoUART
upload_speed = 921600
monitor_port = /dev/cu.SLAB_USBtoUART

; ---- OTA flash environment (subsequent updates over WiFi / tailnet) ----
[env:ota]
; --upload-port is supplied on the CLI: pio run -e ota -t upload --upload-port mockingbird-XXXX.local
upload_protocol = espota
; Optional: encrypted auth — set the same value here and in main.cpp.
; Leave blank for now (the device only listens on the mockingbird LAN which
; is already gated behind WPA2 + Tailscale ACLs).
;upload_flags = --auth=CHANGE-ME
